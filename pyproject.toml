[project]
name = "iris"
version = "0.1.0"
description = "Experimental global workspace architecture"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "hydra-core>=1.3.5",
    "mlflow>=3.15.1",
    "omegaconf>=2.3.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "typer>=0.27.1",
]

[project.scripts]
iris = "iris.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: exercises real integrations across package boundaries",
    "slow: requires heavyweight local resources and explicit opt-in",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "datasets.*",
    "mlflow.*",
]
ignore_missing_imports = true
